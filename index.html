<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover：ノッチやホームバーの下まで背景を広げ、セーフエリアは CSS で避ける -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<!-- ホーム画面に追加したとき、Safariの枠なしで独立して開くための設定 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="推し活">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="app.css">
<title>推し活チェッカー</title>
</head>
<body>
<!-- 背景の飾り（グループの色とロゴ）。操作や文字の後ろに置く -->
<div class="decor" id="decor" aria-hidden="true"></div>
<header class="bar" id="bar">
  <div class="titlerow">
    <h1 id="title">今日</h1>
    <span class="updated" id="updated"></span>
    <button class="iconbtn" id="openSettings" aria-label="設定">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Zm8.3-2.4.1-1.1-.1-1.1 2-1.6-2-3.4-2.4 1a8 8 0 0 0-1.9-1.1L15.6 3h-4l-.4 2.5c-.7.3-1.3.6-1.9 1.1l-2.4-1-2 3.4 2 1.6-.1 1.1.1 1.1-2 1.6 2 3.4 2.4-1c.6.5 1.2.8 1.9 1.1l.4 2.5h4l.4-2.5c.7-.3 1.3-.6 1.9-1.1l2.4 1 2-3.4-2-1.6Z"/></svg>
    </button>
  </div>
  <div class="segmented" id="groupTabs" role="tablist" aria-label="グループ"></div>
  <!-- 絞り込み：メンバーと媒体（押すと選択肢のメニューが出る） -->
  <div class="pickers">
    <button class="picker" id="memberPicker" aria-haspopup="menu"></button>
    <button class="picker" id="filterPicker" aria-haspopup="menu"></button>
  </div>
</header>

<main id="main"><p class="placeholder">読み込み中…</p></main>

<!-- 画面下のタブ（切り替え専用。操作はここに置かない） -->
<nav class="tabbar" id="tabbar" role="tablist" aria-label="画面">
  <button role="tab" data-tab="today" aria-selected="true">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4Zm-1 6v8a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V9Zm2.5 2h3v3h-3z"/></svg>
    <span>今日</span></button>
  <button role="tab" data-tab="vod" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 4h13A2.5 2.5 0 0 1 21 6.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 15.5v-9A2.5 2.5 0 0 1 5.5 4Zm4.5 4v6l5-3Z" fill-rule="evenodd"/><rect x="8" y="19.5" width="8" height="2" rx="1"/></svg>
    <span>見逃し</span><b class="badge" id="vodBadge" hidden></b></button>
  <button role="tab" data-tab="events" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h12a2.5 2.5 0 0 1 2.5 2.5v2a2.5 2.5 0 0 0 0 5v2A2.5 2.5 0 0 1 18 19H6a2.5 2.5 0 0 1-2.5-2.5v-2a2.5 2.5 0 0 0 0-5v-2A2.5 2.5 0 0 1 6 5Zm8 2.5v1.6h1.6V7.5Zm0 3.7v1.6h1.6v-1.6Zm0 3.7v1.6h1.6v-1.6Z" fill-rule="evenodd"/></svg>
    <span>イベント</span></button>
  <button role="tab" data-tab="guide" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.6 6.1 6.6.5-5 4.3 1.6 6.4L12 16.4l-5.8 3.4 1.6-6.4-5-4.3 6.6-.5Z"/></svg>
    <span>ガイド</span></button>
</nav>

<!-- 直前の操作を元に戻すバー（時間で勝手に消さない） -->
<div class="undobar" id="undobar" hidden>
  <span id="undoText"></span>
  <button id="undoBtn">元に戻す</button>
  <button class="iconbtn small" id="undoClose" aria-label="閉じる">✕</button>
</div>

<!-- 下から出るメニュー -->
<div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>

<!-- 押したボタンの近くに出るメニュー -->
<div class="menu-backdrop" id="menuBackdrop" hidden></div>
<div class="menu" id="menu" role="menu" hidden></div>

<!-- 確認ダイアログ（取り消せない操作だけに使う） -->
<div class="alert-backdrop" id="alertBackdrop" hidden>
  <div class="alert" role="alertdialog" aria-modal="true" aria-labelledby="alertTitle">
    <h2 id="alertTitle"></h2><p id="alertText"></p>
    <div class="alert-btns"><button id="alertCancel">キャンセル</button><button id="alertOk" class="ok"></button></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
