# 公式サイトを読んで data/data.json を更新し、アプリ（GitHub Pages）を公開し直す自動処理
#   ・毎日 5:17 と 0:17（日本時間）… cron は UTC で書くので −9時間
#   ・手動（Actions 画面の「Run workflow」）
#   ・ファイルを更新したとき … この場合は公式サイトは読まず、公開だけし直す
name: update-data
on:
  schedule:
    - cron: '17 20 * * *'   # 日本時間 5:17
    - cron: '17 15 * * *'   # 日本時間 0:17
  workflow_dispatch: {}
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 公式サイトを読む
        if: github.event_name != 'push'
        run: node scraper/scrape.mjs
      - name: data.json を保存
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          git diff --cached --quiet || git commit -m "data: update $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
